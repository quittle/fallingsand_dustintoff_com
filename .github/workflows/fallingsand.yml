name: Fallingsand CI

on:
    push:
        branches: ["main"]
    pull_request:
        branches: ["main"]

jobs:
    build:
        runs-on: ubuntu-latest
        permissions:
            id-token: write
            contents: read

        steps:
            - name: Checkout
              uses: actions/checkout@v7
            - name: Setup NodeJS
              uses: actions/setup-node@v7
              with:
                  node-version-file: ".nvmrc"
                  cache: "npm"
            - name: Cache browser binaries
              uses: actions/cache@v6
              with:
                  path: |
                      ~/.cache/puppeteer
                      ~/.cache/electron
                  key: ${{ runner.os }}-browser-binaries-${{ hashFiles('package-lock.json') }}
            - run: npm ci
            - run: npm run build
            - name: Setup Rust
              run: rustup set profile default
            - run: npm run wasm-pack
            - run: npm run test
            - name: Configure AWS Credentials
              if: github.ref == 'refs/heads/main' && github.event_name == 'push'
              uses: aws-actions/configure-aws-credentials@v6.3.0
              with:
                  role-to-assume: arn:aws:iam::915290536872:role/fallingsand.dustintoff.com-deploy
                  role-session-name: Deploy_via_GitHub_to_AWS_via_FederatedOIDC
                  aws-region: us-east-1
            - name: Deploy to S3
              if: github.ref == 'refs/heads/main' && github.event_name == 'push'
              run: |
                  aws s3 sync dist/ s3://fallingsand.dustintoff.com --delete --cache-control "public, max-age=900" --exclude "*.grw"
                  aws s3 sync dist/ s3://fallingsand.dustintoff.com --delete --cache-control "public, max-age=900" --exclude "*" --include "*.grw" --content-type "text/xml"
