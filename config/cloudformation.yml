AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Parameters:
    DeploymentContentVersion:
        Type: String
        Description: Any unique string identifying the files being deployed. The deploy script passes the packaged CodeUri (an S3 URI that changes whenever the content changes).
Description: Manage the existing fallingsand.dustintoff.com bucket and CloudFront distribution (imported, not created).

Resources:

    S3UploadLambdaLayer:
        Type: AWS::Serverless::LayerVersion
        Properties:
            ContentUri: ../node_modules/s3-upload-custom-resource-lambda-layer/dist/layer.zip

    S3UploadLambda:
        Type: AWS::Serverless::Function
        Properties:
            Layers: [!Ref S3UploadLambdaLayer]
            CodeUri: ../dist
            Handler: s3-upload-custom-resource.handler
            MemorySize: 10240
            Timeout: 180
            Runtime: nodejs24.x
            Policies:
                - S3CrudPolicy:
                    BucketName: !Ref WebsiteBucket

    DeployWebsite:
        Type: Custom::UploadFilesToS3
        Properties:
            ServiceToken: !GetAtt S3UploadLambda.Arn
            BucketName: !Ref WebsiteBucket
            ContentVersion: !Ref DeploymentContentVersion

    SiteCertificate:
        Type: AWS::CertificateManager::Certificate
        Properties:
            DomainName: fallingsand.dustintoff.com
            ValidationMethod: DNS

    WebsiteBucket:
        Type: AWS::S3::Bucket
        Properties:
            BucketName: fallingsand.dustintoff.com
            WebsiteConfiguration:
                IndexDocument: index.html

    WebsiteBucketPolicy:
        Type: AWS::S3::BucketPolicy
        Properties:
            Bucket: !Ref WebsiteBucket
            PolicyDocument:
                Version: "2012-10-17"
                Id: Policy1517636620456
                Statement:
                    - Sid: Stmt1517636618597
                      Effect: Allow
                      Principal: "*"
                      Action: s3:GetObject
                      Resource: !Sub "arn:aws:s3:::${WebsiteBucket}/*"

    WwwDistribution:
        Type: AWS::CloudFront::Distribution
        Properties:
            DistributionConfig:
                Aliases:
                    - fallingsand.dustintoff.com
                DefaultRootObject: index.html
                DefaultCacheBehavior:
                    TargetOriginId: S3-fallingsand.dustintoff.com
                    ViewerProtocolPolicy: redirect-to-https
                    CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
                Enabled: true
                Origins:
                    - Id: S3-fallingsand.dustintoff.com
                      DomainName: fallingsand.dustintoff.com.s3.amazonaws.com
                      S3OriginConfig:
                          OriginAccessIdentity: ""
                PriceClass: PriceClass_100
                HttpVersion: http2and3
                ViewerCertificate:
                    AcmCertificateArn: !Ref SiteCertificate
                    MinimumProtocolVersion: TLSv1.2_2021
                    # SslSupportMethod is a cfn-lint dependency of AcmCertificateArn (E3021).
                    SslSupportMethod: sni-only
